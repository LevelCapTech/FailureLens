name: Notify FailureLens Discord

on:
  pull_request_target:
    types: [opened, closed]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Send selected GitHub event to Discord
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          FAILURELENS_DISCORD_WEBHOOK_URL: ${{ secrets.FAILURELENS_DISCORD_WEBHOOK_URL }}
        run: python3 .github/scripts/notify_discord.py
