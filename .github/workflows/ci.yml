name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tracking:
    name: optional MLflow tracking (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml
      - name: Install optional tracking and dev tooling
        run: python -m pip install -e "packages/python[dev,tracking]"
      - name: Verify real SQLite tracking and artifact round trips
        env:
          MLFLOW_DISABLE_TELEMETRY: "true"
        run: python -m pytest packages/python/tests/test_experiment_tracking.py tests/integration/test_mlflow_tracking.py

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml

      - name: Install the package (with dev extras)
        run: python -m pip install -e "packages/python[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Smoke-test the CLI
        run: |
          failurelens version
          failurelens diagnose \
            --repo examples/fixtures/sample_project \
            --log examples/fixtures/sample_project/failure.log \
            --format json --quiet
