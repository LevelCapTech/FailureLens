# Pre-commit hooks for FailureLens.
#
# Install once with:  pip install pre-commit && pre-commit install
# Run on demand with: pre-commit run --all-files
# Refresh versions:   pre-commit autoupdate
#
# These mirror the checks enforced in CI (.github/workflows/lint.yml).
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^packages/python/src/failurelens/
        additional_dependencies:
          - pydantic>=2.6
